<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Day of Defeat 1.3 — Web Demo Viewer (local, dynamic FS)</title>
<meta name="description" content="Local-only variant: mounts a real Half-Life/DoD install directly via Emscripten lazy files instead of a prebuilt zip." />

<script>
  window.coi = {
    coepCredentialless: () => !(window.chrome === undefined || navigator.userAgentData?.brands === undefined),
    coepDegrades: true,
    quiet: false,
    doReload: () => window.location.reload(),
  };
</script>
<script src="./coi-serviceworker.js"></script>

<style>
  :root {
    --bg:            #0a0b0d;
    --panel:         #14161a;
    --panel-border:  #23272e;
    --text:          #e6e8ec;
    --text-dim:      #8b929e;
    --accent:        #c8a45c;
    --accent-dim:    #6d5a33;
    --danger:        #e0574a;
    --font-ui:       ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono:     ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-ui); overscroll-behavior: none; }
  #viewport { position: fixed; inset: 0; display: block; background: #000; }
  #canvas { display: block; width: 100%; height: 100%; outline: none; border: 0; image-rendering: pixelated; touch-action: none; cursor: default; }
  #canvas.locked { cursor: none; }
  #overlay { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: radial-gradient(1200px 700px at 50% 38%, #1a1d23 0%, #0a0b0d 72%); transition: opacity .45s ease, visibility .45s ease; }
  #overlay[hidden] { display: none; }
  #overlay.fading { opacity: 0; visibility: hidden; pointer-events: none; }
  .boot { width: min(560px, calc(100vw - 48px)); text-align: center; padding: 0 8px; }
  .boot h1 { margin: 0 0 6px; font-size: clamp(20px, 4.4vw, 30px); font-weight: 650; letter-spacing: .10em; text-transform: uppercase; color: var(--accent); }
  .boot .sub { margin: 0 0 30px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); }
  .bar { position: relative; height: 4px; width: 100%; background: #202429; border-radius: 2px; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; width: 0%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width .18s linear; }
  .bar.indeterminate > i { width: 34% !important; animation: slide 1.15s cubic-bezier(.65,.05,.36,1) infinite; }
  @keyframes slide { 0% { left: -34%; } 100% { left: 100%; } }
  #status { margin-top: 14px; min-height: 18px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); letter-spacing: .02em; }
  #hint { margin-top: 34px; font-size: 12px; line-height: 1.75; color: #5f6773; }
  #hint kbd { font-family: var(--font-mono); font-size: 11px; background: #1c1f24; border: 1px solid var(--panel-border); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--text-dim); }
  #startBtn { margin-top: 28px; appearance: none; border: 1px solid var(--accent-dim); background: transparent; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding: 12px 34px; border-radius: 3px; cursor: pointer; transition: background .16s ease, color .16s ease; }
  #startBtn:hover { background: var(--accent); color: #0a0b0d; }
  #startBtn:active { transform: translateY(1px); }
  #startBtn[hidden] { display: none; }
  #error { width: min(720px, calc(100vw - 48px)); background: var(--panel); border: 1px solid var(--panel-border); border-left: 3px solid var(--danger); border-radius: 4px; padding: 22px 26px; text-align: left; }
  #error[hidden] { display: none; }
  #error h2 { margin: 0 0 10px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--danger); }
  #error pre { margin: 0; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 42vh; overflow: auto; }
  #log { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: 30vh; margin: 0; padding: 10px 14px; overflow: auto; background: rgba(6, 7, 9, .88); border-top: 1px solid var(--panel-border); font-family: var(--font-mono); font-size: 11px; line-height: 1.5; color: #9aa3b0; white-space: pre-wrap; word-break: break-word; backdrop-filter: blur(3px); }
  #log[hidden] { display: none; }
  #log .err { color: var(--danger); }
  @media (prefers-reduced-motion: reduce) { .bar.indeterminate > i { animation: none; width: 100% !important; } #overlay, .bar > i { transition: none; } }
</style>
</head>

<body>

<div id="viewport">
  <canvas id="canvas" tabindex="0" aria-label="Day of Defeat demo playback surface"></canvas>
</div>

<div id="overlay">
  <div class="boot">
    <h1>Day of Defeat 1.3</h1>
    <p class="sub">Web Demo Viewer — local dynamic FS</p>

    <div class="bar indeterminate" id="barWrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Loading progress">
      <i id="bar"></i>
    </div>

    <div id="status" role="status" aria-live="polite">Initialising…</div>

    <button id="startBtn" hidden>Play Demo</button>

    <div id="hint">
      <kbd>Esc</kbd> release cursor &nbsp;·&nbsp;
      <kbd>~</kbd> console &nbsp;·&nbsp;
      <kbd>F5</kbd> free-look camera &nbsp;·&nbsp;
      <kbd>Shift</kbd>+<kbd>F2</kbd> demo timeline
    </div>

    <div id="error" hidden>
      <h2>Startup failed</h2>
      <pre id="errorText"></pre>
    </div>
  </div>
</div>

<pre id="log" hidden></pre>

<script type="module">
/* ============================================================================
 *  DoD 1.3 Web Demo Viewer — LOCAL DYNAMIC-FS variant
 *
 *  Difference from index.html: instead of downloading one prebuilt zip and
 *  extracting every file into the Emscripten VFS up front, this fetches
 *  /manifest.json from server.js (a flat list of every real file across
 *  overlay/ + the real Steam dod/ + valve/ installs, merged with overlay
 *  winning on name collision) and registers each one with
 *  FS.createLazyFile() -- Emscripten only fetches a file's actual bytes
 *  (via HTTP Range requests) the first time the engine opens it. No zip,
 *  no repackaging step: editing a file on disk is live on next reload.
 *
 *  Boot order is still load-bearing: new Xash3D() -> init() -> mount ->
 *  main().
 * ==========================================================================*/

import { Xash3D } from 'https://cdn.jsdelivr.net/npm/xash3d-fwgs@1.2.2/+esm';

const XASH_VERSION = '1.2.2';
const CDN = `https://cdn.jsdelivr.net/npm/xash3d-fwgs@${XASH_VERSION}/dist`;

// Same TEMPORARY-TEST posture as index.html: no compiled DoD client/server
// wasm exists, so we run as plain Half-Life ('valve') and mount DoD demo
// content into that same VFS root. Our own overlay's liblist.gam-derived
// dlls (dlls/hl_emscripten_wasm32.wasm, cl_dlls/client_emscripten_wasm32.wasm)
// are the same hlsdk-portable@0.1.3 build index.html points at, just served
// from our own local manifest instead of jsDelivr.
const GAME_DIR = 'valve';

const CONFIG = {
  gameDir: GAME_DIR,
  manifestUrl: '/manifest.json',
  gameUrlPrefix: '/game/',
  renderer: 'gl4es',
  clientLib: '/game/cl_dlls/client_emscripten_wasm32.wasm',
  serverLib: '/game/dlls/hl_emscripten_wasm32.wasm',
  demoBootDelayMs: 1200,
};

const Q = new URLSearchParams(location.search);

function parseDemoName(raw) {
  if (!raw) return null;
  let name = String(raw).trim().replace(/\\/g, '/');
  if (!name) return null;
  if (name.startsWith('/') || name.split('/').includes('..')) return null;
  if (!/^[A-Za-z0-9._\-/]+$/.test(name)) return null;
  name = name.replace(/\.dem$/i, '');
  return name || null;
}

function parseMapName(raw) {
  if (!raw) return null;
  const name = String(raw).trim().replace(/\.bsp$/i, '');
  return /^[A-Za-z0-9._-]+$/.test(name) ? name : null;
}

const REQUEST = {
  demo: parseDemoName(Q.get('demo')) || 'ktptest',
  map: parseMapName(Q.get('map')),
  renderer: ['gl4es', 'gles3compat', 'soft'].includes(Q.get('renderer')) ? Q.get('renderer') : CONFIG.renderer,
  dev: Q.get('dev') === '1',
  autostart: Q.get('autostart') === '1',
};

const els = {
  canvas: document.getElementById('canvas'),
  overlay: document.getElementById('overlay'),
  barWrap: document.getElementById('barWrap'),
  bar: document.getElementById('bar'),
  status: document.getElementById('status'),
  hint: document.getElementById('hint'),
  startBtn: document.getElementById('startBtn'),
  error: document.getElementById('error'),
  errorText: document.getElementById('errorText'),
  log: document.getElementById('log'),
};

if (REQUEST.dev) els.log.hidden = false;

function setStatus(text) { els.status.textContent = text; }

function setProgress(progress) {
  if (progress == null) {
    els.barWrap.classList.add('indeterminate');
    els.barWrap.removeAttribute('aria-valuenow');
    return;
  }
  const pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
  els.barWrap.classList.remove('indeterminate');
  els.bar.style.width = pct + '%';
  els.barWrap.setAttribute('aria-valuenow', String(pct));
}

function hideOverlay() {
  els.overlay.classList.add('fading');
  setTimeout(() => { els.overlay.hidden = true; }, 500);
}

function fail(err) {
  const detail = err && err.stack ? err.stack : String(err);
  console.error('[viewer]', err);
  els.overlay.hidden = false;
  els.overlay.classList.remove('fading');
  els.barWrap.style.display = 'none';
  els.startBtn.hidden = true;
  els.hint.hidden = true;
  els.error.hidden = false;
  els.errorText.textContent = detail;
  setStatus('');
}

function devLog(line, isErr) {
  if (!REQUEST.dev) return;
  const span = document.createElement('span');
  if (isErr) span.className = 'err';
  span.textContent = line + '\n';
  els.log.appendChild(span);
  if (els.log.scrollTop + els.log.clientHeight >= els.log.scrollHeight - 40) {
    els.log.scrollTop = els.log.scrollHeight;
  }
}

/**
 * Fetch every manifest entry and write it into the VFS. `FS.createLazyFile`
 * (true on-demand, zero bytes fetched until first open) turned out not to
 * work here: this engine build is single-threaded (no xash.worker.js), so
 * its lazy-read path runs a synchronous XHR on the main thread, which
 * Chromium refuses for binary requests outside a Web Worker
 * ("Cannot do synchronous binary XHRs outside webworkers in modern
 * browsers"). This is a real Emscripten/browser constraint, not a config
 * bug -- confirmed by hitting it, not by reading docs.
 *
 * Falling back to eager `fetch()` (always async, always allowed) + one
 * `FS.writeFile()` per entry. Still no zip: the manifest is server.js's own
 * `overlay/` + `packed/` (xash-transcode `pack`'s output, already scoped to
 * just this demo's real resourcelist) merged live off disk, so there is
 * still nothing to hand-build or re-zip between iterations -- only the
 * "fetch nothing until touched" property was unavailable.
 */
async function mountFromManifest(FS, mountPoint) {
  const res = await fetch(CONFIG.manifestUrl, { cache: 'no-store' });
  if (!res.ok) throw new Error(`Failed to fetch manifest: HTTP ${res.status}`);
  const paths = await res.json();

  const seenDirs = new Set([mountPoint]);
  FS.mkdirTree(mountPoint);

  let done = 0;
  const CONCURRENCY = 8;
  let next = 0;
  async function worker() {
    while (next < paths.length) {
      const rel = paths[next++];
      const slash = rel.lastIndexOf('/');
      const dir = slash === -1 ? mountPoint : `${mountPoint}/${rel.slice(0, slash)}`;
      const name = slash === -1 ? rel : rel.slice(slash + 1);
      if (!seenDirs.has(dir)) {
        FS.mkdirTree(dir);
        seenDirs.add(dir);
      }
      const r = await fetch(CONFIG.gameUrlPrefix + rel, { cache: 'no-store' });
      if (!r.ok) throw new Error(`Failed to fetch ${rel}: HTTP ${r.status}`);
      const bytes = new Uint8Array(await r.arrayBuffer());
      FS.writeFile(`${dir}/${name}`, bytes);
      done++;
      if ((done & 15) === 0) {
        setStatus(`Fetching local files… ${done}/${paths.length}`);
        setProgress(done / paths.length);
      }
    }
  }
  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  return { files: done };
}

function appUrl(path) {
  if (/^(https?:)?\/\//i.test(path) || path.startsWith('data:') || path.startsWith('blob:')) return path;
  return new URL(path.replace(/^\/+/, './').replace(/^\.\//, ''), document.baseURI).href;
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(320, Math.floor(window.innerWidth * dpr));
  const h = Math.max(240, Math.floor(window.innerHeight * dpr));
  if (els.canvas.width !== w || els.canvas.height !== h) {
    els.canvas.width = w;
    els.canvas.height = h;
  }
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas, { passive: true });
window.addEventListener('orientationchange', resizeCanvas, { passive: true });

window.addEventListener('keydown', (e) => {
  if (document.activeElement !== els.canvas) return;
  if (['Tab', 'F5', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code) && !e.ctrlKey && !e.metaKey) {
    e.preventDefault();
  }
}, { capture: true });

document.addEventListener('pointerlockchange', () => {
  els.canvas.classList.toggle('locked', document.pointerLockElement === els.canvas);
});

function buildArgs() {
  const args = ['-game', CONFIG.gameDir, '-nomouse'];
  if (REQUEST.dev) args.push('-console', '-dev', '2');
  if (REQUEST.demo) args.push('+playdemo', REQUEST.demo);
  else if (REQUEST.map) args.push('+map', REQUEST.map);
  return args;
}

const xash = new Xash3D({
  canvas: els.canvas,
  renderer: REQUEST.renderer,
  arguments: buildArgs(),
  libraries: {
    client: appUrl(CONFIG.clientLib),
    server: appUrl(CONFIG.serverLib),
  },
  filesMap: {
    'xash.wasm': `${CDN}/xash.wasm`,
    'filesystem_stdio.wasm': `${CDN}/filesystem_stdio.wasm`,
    'libref_webgl2.wasm': `${CDN}/libref_webgl2.wasm`,
    'libref_soft.wasm': `${CDN}/libref_soft.wasm`,
    'cl_dlls/menu_emscripten_wasm32.wasm': `${CDN}/libmenu.wasm`,
  },
  module: {
    print: (line) => { devLog(line, false); },
    printErr: (line) => { devLog(line, true); },
  },
});
window.xash = xash;

async function boot() {
  try {
    if (!self.crossOriginIsolated) {
      devLog('[viewer] Not cross-origin isolated. SharedArrayBuffer is unavailable; check that coi-serviceworker.js registered.', true);
    }

    setStatus('Starting engine runtime…');
    setProgress(null);
    await xash.init();

    if (!xash.em || !xash.em.FS) throw new Error('Engine initialised but exposed no filesystem.');

    setStatus('Fetching local files…');
    const result = await mountFromManifest(xash.em.FS, `/${CONFIG.gameDir}`);
    devLog(`[viewer] fetched ${result.files} files -> /${CONFIG.gameDir}`);

    setProgress(1);
    setStatus(REQUEST.demo ? `Ready — ${REQUEST.demo}.dem` : 'Ready');

    if (REQUEST.autostart) {
      start();
    } else {
      els.startBtn.hidden = false;
      els.startBtn.textContent = REQUEST.demo ? 'Play Demo' : 'Launch';
      els.startBtn.addEventListener('click', start, { once: true });
    }
  } catch (err) {
    fail(err);
  }
}

function start() {
  try {
    els.startBtn.hidden = true;
    setStatus('Launching…');
    xash.main();
    hideOverlay();
    els.canvas.focus();

    setTimeout(() => {
      if (xash.exited) return;
      xash.Cmd_ExecuteString('m_ignore 1');
      if (REQUEST.demo) xash.Cmd_ExecuteString(`playdemo ${REQUEST.demo}`);
      else if (REQUEST.map) xash.Cmd_ExecuteString(`map ${REQUEST.map}`);
    }, CONFIG.demoBootDelayMs);
  } catch (err) {
    fail(err);
  }
}

window.addEventListener('error', (e) => {
  if (els.overlay.hidden) return;
  fail(e.error || e.message);
});

boot();
</script>

</body>
</html>
